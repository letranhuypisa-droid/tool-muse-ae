<!doctype html>
<html>
<head><meta charset="utf-8"><title>fake muse</title></head>
<body>
  <!-- Bắt chước đúng các selector đã dò được trên muse.ai ngày 2026-11-02. -->
  <div id="scroller"><div role="log" id="log"></div></div>
  <button id="pill" hidden>new messages</button>
  <div id="composer">
    <div id="previews"></div>
    <input type="file" multiple id="file" style="position:absolute;width:1px;height:1px;opacity:0">
    <div><textarea placeholder="Message" id="msg"></textarea></div>
    <button aria-label="Send" id="send">↑</button>
  </div>
  <script>
    window.__sends = 0;
    const params = new URLSearchParams(location.search);
    if (params.has("loggedout")) document.getElementById("composer").remove();

    const log = document.getElementById("log");
    const scroller = document.getElementById("scroller");
    const pill = document.getElementById("pill");

    // ?lazy: giống muse.ai thật với chat dài — trang mở ở chỗ đọc dở, tin nhắn mới chỉ được vẽ
    // khi khung chat được cuộn xuống cuối (trước đó chỉ hiện nút "N messages").
    const lazy = params.has("lazy");
    const pending = [];
    if (lazy) {
      scroller.style.cssText = "height:300px;overflow:auto";
      const history = document.createElement("div");
      history.style.height = "3000px";
      history.textContent = "lịch sử chat cũ";
      log.append(history);
      scroller.scrollTop = 0;
    }
    const atBottom = () => scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 10;
    function show(...nodes) {
      if (!lazy || atBottom()) return log.append(...nodes);
      pending.push(...nodes);
      pill.hidden = false;
      pill.textContent = pending.length + " messages";
    }
    scroller.addEventListener("scroll", () => {
      if (!lazy || !atBottom() || !pending.length) return;
      log.append(...pending.splice(0));
      pill.hidden = true;
    });
    const msg = document.getElementById("msg");
    const file = document.getElementById("file");
    const previews = document.getElementById("previews");

    // Như muse.ai thật: ảnh xem trước hiện ngay, nhưng nút Send bị khóa tới khi ảnh tải lên xong.
    const send = document.getElementById("send");
    window.__undelivered = 0;
    file?.addEventListener("change", () => {
      for (const f of file.files) {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(f);
        previews.append(img);
      }
      send.disabled = true;
      setTimeout(() => (send.disabled = false), 1500);
    });

    msg?.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter" || e.shiftKey) return;
      e.preventDefault();
      if (window.__blockSend) return; // giả lập muse không nhận Enter (đang tải ảnh, có hộp thoại…)
      if (send.disabled) {
        // Gửi khi ảnh chưa tải xong: tin nhắn hiện ra nhưng không tới được Muse.
        const lost = document.createElement("div");
        lost.className = "user";
        lost.textContent = msg.value + " — Delivery not confirmed";
        log.append(lost);
        msg.value = "";
        previews.innerHTML = "";
        window.__undelivered++;
        return;
      }
      const text = msg.value;
      msg.value = "";
      previews.innerHTML = "";
      window.__sends++;

      const user = document.createElement("div");
      user.className = "user";
      user.textContent = text;
      log.append(user);

      const stop = document.createElement("button");
      stop.setAttribute("aria-label", "Stop");
      stop.textContent = "■";
      document.body.append(stop);
      await new Promise((r) => setTimeout(r, 1500));
      stop.remove();

      const reply = document.createElement("div");
      reply.className = "assistant";
      if (text.includes("LIMIT")) {
        reply.textContent = "You've reached your daily limit";
        show(reply);
        return;
      }
      reply.textContent = "Xong rồi";
      if (params.has("slowmedia")) await new Promise((r) => setTimeout(r, 5000));

      if (text.includes("video")) {
        const url = URL.createObjectURL(await (await fetch("/sample.mp4")).blob());
        const wrap = document.createElement("div");
        wrap.setAttribute("data-hatch-video-wrapper", "true");
        wrap.setAttribute("data-hatch-video-src", url);
        wrap.setAttribute("aria-busy", "false");
        const video = document.createElement("video");
        video.src = url;
        wrap.append(video);
        show(reply, wrap);
      } else {
        const url = URL.createObjectURL(await (await fetch("/sample.png")).blob());
        const btn = document.createElement("button");
        btn.setAttribute("data-pel-click", "chat_media_click");
        const img = document.createElement("img");
        img.src = url;
        btn.append(img);
        show(reply, btn);
      }
    });
  </script>
</body>
</html>
